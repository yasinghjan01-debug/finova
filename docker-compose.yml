version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: finova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finova_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finova_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-finova_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finova_user -d finova_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: finova-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-finova_user}:${POSTGRES_PASSWORD:-finova_secure_password}@postgres:5432/${POSTGRES_DB:-finova_db}
      - SECRET_KEY=${SECRET_KEY:-change_this_secret_key_in_production_32char}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - HOST=0.0.0.0
      - PORT=8000

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: finova-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000/api/v1
      - FASTAPI_BACKEND_URL=http://api:8000/api/v1

volumes:
  postgres_data:
